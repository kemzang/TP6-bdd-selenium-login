name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Installer Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Tests BDD (Cucumber + Selenium, Chrome headless)
        run: mvn test
